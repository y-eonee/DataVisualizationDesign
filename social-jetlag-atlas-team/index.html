<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="평일과 주말 사이, 우리 몸이 겪는 사회적 시차를 살펴봅니다.">
  <meta name="theme-color" content="#000000">
  <title>Social Jetlag — Sleep Atlas</title>
  <style>
    :root{color-scheme:dark;--ink:#fff;--line:#363636;--muted:#bfbfbf;--gutter:clamp(1.25rem,6vw,7rem);--orbit-size:clamp(300px,94svh,1000px)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#000;color:var(--ink);font-family:Geist,Inter,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word;overflow-x:clip}
    a{color:inherit}
    a:focus-visible{outline:2px solid #fff;outline-offset:6px}
    main{position:relative;z-index:1}
    .intro-orbit{
      position:fixed;left:72%;top:50%;z-index:0;
      width:var(--orbit-size);aspect-ratio:1;pointer-events:none;
      transform:translate(-50%,-50%);
      opacity:.68
    }
    .intro-orbit canvas{
      position:absolute;left:-60%;top:-60%;width:220%;height:220%;display:block
    }
    .orbit-exit{height:32svh}
    .orbit-exit[hidden]{display:none}
    .orbit-scroll-hint{font-size:.77rem;color:var(--muted);margin:1.15rem 0 0}
    .intro-leaving main{opacity:0;transition:opacity .24s ease;pointer-events:none}
    .hero,.outro{padding-inline:var(--gutter)}
    .hero{--shift:0px;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding-block:clamp(1.5rem,4vh,3rem);overflow:hidden}
    .brand,.scroll-link{font:500 .74rem/1.35 "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase}
    .brand{display:flex;align-items:center;gap:.7rem}
    .brand::before{content:"";width:.5rem;height:.5rem;border:1px solid currentColor;border-radius:50%}
    .hero-title{align-self:center;margin:.25em 0 .25em;font-family:Geist,Inter,Arial,sans-serif;font-size:clamp(3.65rem,17vw,17rem);font-weight:800;letter-spacing:-.07em;line-height:.77}
    .title-mask{display:block;overflow:hidden;padding:.065em .12em .275em 0;margin-bottom:-.22em}
    .title-mask:nth-child(2){padding-left:clamp(.2em,13vw,1em)}
    .title-word{display:block;width:max-content;transform:translateX(var(--shift))}
    .title-mask:nth-child(2) .title-word{transform:translateX(calc(-1 * var(--shift)))}
    .title-letter{display:inline-block}
    .motion .title-letter{opacity:0}
    .motion .hero-title.is-visible .title-letter{animation:title-in .9s cubic-bezier(.2,.8,.2,1) calc(var(--letter) * 85ms) both}
    @keyframes title-in{from{translate:0 .65em;opacity:0}to{translate:0 0;opacity:1}}
    .hero-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:1.25rem;gap:1rem}
    .hero-footer p{margin:0;font-size:.84rem;color:var(--muted)}
    .scroll-link{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;min-height:2.75rem;white-space:nowrap}
    .scroll-link span,.cta span{display:inline-block;transition:transform .25s ease}
    .scroll-link:hover span{transform:translateY(.25rem)}
    .outro{min-height:64svh;display:grid;place-items:center;text-align:center;border-top:1px solid var(--line);padding-block:5rem}
    .outro h2{font-size:clamp(1.65rem,4.3vw,4.25rem);line-height:1.15;letter-spacing:.025em;text-wrap:balance;max-width:17em;margin:0 auto 1.8rem}
    .cta{display:inline-flex;align-items:center;gap:2rem;border:1px solid #fff;border-radius:99px;padding:1rem 1.5rem;text-decoration:none;transition:background .25s,color .25s}
    .cta:hover{background:#fff;color:#000}
    .cta:hover span{transform:translateY(.25rem)}
    .motion .reveal{opacity:0;transform:translateY(2.7rem)}
    .motion .reveal.is-visible{opacity:1;transform:none;transition:opacity 1.15s ease,transform 1.45s cubic-bezier(.22,.68,.28,1)}
    .motion .chapter-body .reveal.is-visible{transition-delay:var(--sentence-delay,0ms)}
    .motion .reveal:focus-within{opacity:1;transform:none;transition:none}
    @media(max-width:650px){
      :root{--orbit-size:clamp(260px,86vw,520px)}
      .hero-title{font-size:clamp(3rem,17vw,7rem)}
      .title-mask:nth-child(2){padding-left:.35em}
      .hero-footer{gap:.5rem}
      .hero-footer p{font-size:.76rem}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important}
      .motion .reveal,.motion .title-letter{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <div class="intro-orbit" aria-hidden="true">
    <canvas id="planet"></canvas>
  </div>
  <main>
    <header class="hero">
      <div class="brand">Sleep Atlas</div>
      <h1 class="hero-title" lang="en" aria-label="Social Jetlag">
        <span class="title-mask" aria-hidden="true"><span class="title-word">Social</span></span>
        <span class="title-mask" aria-hidden="true"><span class="title-word">Jetlag</span></span>
      </h1>
      <div class="hero-footer">
        <p>평일과 주말 사이, 몸이 겪는 시차</p>
        <a class="scroll-link" href="#outro-title" aria-label="스크롤해서 시각화로 이동">Scroll <span aria-hidden="true">↓</span></a>
      </div>
    </header>

    <section class="outro" aria-labelledby="outro-title">
      <div class="reveal">
        <h2 id="outro-title">평일과 주말의 사회적 시차를 살펴보세요.</h2>
        <a class="cta" href="sleep_atlas_data_landscape_matte.html">시각화 보러가기 <span aria-hidden="true">↓</span></a>
        <p class="orbit-scroll-hint" hidden>더 내리면 시각화로 이어집니다 ↓</p>
      </div>
    </section>
    <div class="orbit-exit" aria-hidden="true" hidden></div>
  </main>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    if (!reducedMotion.matches) {
      let letterIndex = 0;
      for (const word of document.querySelectorAll('.title-word')) {
        const letters = Array.from(word.textContent, character => {
          const letter = document.createElement('span');
          letter.className = 'title-letter';
          letter.style.setProperty('--letter', letterIndex++);
          letter.textContent = character;
          return letter;
        });
        word.replaceChildren(...letters);
      }

      const title = document.querySelector('.hero-title');
      const reveals = Array.from(document.querySelectorAll('.reveal'));
      const sentences = new Set();
      let frame = 0;
      let nextSentenceStart = 0;

      function updateMotion() {
        frame = 0;
        const height = window.innerHeight;
        const titleBounds = title.getBoundingClientRect();
        const revealBounds = reveals.map(element => element.getBoundingClientRect());
        const now = performance.now();
        title.classList.toggle('is-visible', titleBounds.bottom > 0 && titleBounds.top < height);
        reveals.forEach((element, index) => {
          const bounds = revealBounds[index];
          if (bounds.top >= height) {
            element.classList.remove('is-visible');
          } else if (bounds.top < height * 0.92 && bounds.bottom > 0 && !element.classList.contains('is-visible')) {
            if (sentences.has(element)) {
              const start = Math.max(now, nextSentenceStart);
              element.style.setProperty('--sentence-delay', `${start - now}ms`);
              nextSentenceStart = start + 180;
            }
            element.classList.add('is-visible');
          }
        });
      }

      function scheduleMotion() {
        if (!frame) frame = requestAnimationFrame(updateMotion);
      }

      document.documentElement.classList.add('motion');
      window.addEventListener('scroll', scheduleMotion, { passive: true });
      window.addEventListener('resize', scheduleMotion);
      window.addEventListener('pageshow', scheduleMotion);
      updateMotion();
    }

    const hero = document.querySelector('.hero');
    if (matchMedia('(pointer: fine)').matches) {
      hero.addEventListener('pointermove', event => {
        if (reducedMotion.matches) return;
        const position = event.clientX / hero.clientWidth - 0.5;
        hero.style.setProperty('--shift', `${position * 30}px`);
      });
      hero.addEventListener('pointerleave', () => hero.style.removeProperty('--shift'));
    }

    (() => {
      // 컬러 등고선 행성 (온보딩 모션): 계속 도는 행성이 스크롤하면 고리가 늘어나고, 맨 아래에서 열리며 구로 이어진다.
      const orbit = document.querySelector('.intro-orbit');
      const cv = document.getElementById('planet');
      const cx = cv.getContext('2d');
      const exit = document.querySelector('.orbit-exit');
      const link = document.querySelector('.cta');
      const hint = document.querySelector('.orbit-scroll-hint');
      const PAL = ['#F68CC0','#EDCD72','#78DCAD','#72BFED','#BB9BFF'];
      const clamp = (x,a = 0,b = 1) => Math.min(b,Math.max(a,x));
      const easeO = x => 1 - Math.pow(1 - clamp(x),4);
      const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2,3) / 2; };
      const N = 18;
      const rings = [];
      for (let k = 0; k < N; k++) {
        const dots = [];
        for (let d = 0; d < 3 + (k % 5); d++) dots.push({a:Math.random() * 6.283,s:(Math.random() < .5 ? -1 : 1) * (.08 + Math.random() * .22),r:1.6 + Math.random() * 2.6});
        rings.push({ph:k * 1.7,c:PAL[k % 5],dots,a1:.035 + .03 * Math.sin(k * 1.3),a2:.02 + .02 * Math.cos(k * .9)});
      }
      let W = 0,H = 0,dpr = 1,size = 0;
      function resize() {
        dpr = Math.min(2,devicePixelRatio || 1);
        const box = cv.getBoundingClientRect();
        W = box.width; H = box.height;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        size = orbit.getBoundingClientRect().width;
      }
      function blob(R,ring,t,steps,extra) {
        cx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const th = i / steps * 6.2832;
          const r = R * (1 + ring.a1 * Math.sin(3 * th + ring.ph + t * .5) + ring.a2 * Math.sin(5 * th - ring.ph * 1.3 - t * .35) + (extra || 0));
          const x = Math.cos(th) * r,y = Math.sin(th) * r * .94;
          i ? cx.lineTo(x,y) : cx.moveTo(x,y);
        }
      }
      let leaving = false,openT = 0,openStart = 0,ripple = 0,velocity = 0,lastY = window.scrollY,progress = 0,previousFrame = 0;
      const t0 = performance.now();
      function draw(now) {
        const t = now / 1000,loadT = (now - t0) / 1000;
        const er = leaving ? easeIO((now - openStart) / 900) : 0;
        cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
        cx.save(); cx.translate(W / 2,H / 2);
        cx.lineJoin = 'round'; cx.globalCompositeOperation = 'lighter';
        const base = size * .5;
        const grow = reducedMotion.matches ? 1 : easeO(loadT / 2.6);
        const fade = 1 - er;
        for (let k = 0; k < N; k++) {
          const f = k / (N - 1),a = clamp((grow - f * .85) * 5);
          if (a <= 0 || fade <= 0) continue;
          const Rk = base * (.1 + .9 * Math.pow(f,.85)) * (1 + er * 3.2);
          const ring = rings[k];
          cx.globalAlpha = a * fade * (.22 + .3 * (1 - f)) * 1.5;
          cx.strokeStyle = ring.c; cx.lineWidth = 1.1 + (k % 4 === 0 ? .8 : 0);
          cx.save(); cx.rotate(t * .03 * (k % 2 ? 1 : -1) + progress * 2.4 * (k % 2 ? 1 : -1));
          blob(Rk,ring,t,160,ripple * .004); cx.stroke();
          if (k % 6 === 2) { cx.globalAlpha *= .12; cx.fillStyle = ring.c; cx.fill(); }
          cx.restore();
          cx.globalAlpha = a * fade * .9;
          for (const d of ring.dots) {
            const th = d.a + t * d.s + progress * 3 * (k % 2 ? 1 : -1);
            const r = Rk * (1 + ring.a1 * Math.sin(3 * th + ring.ph + t * .5) + ripple * .004);
            cx.fillStyle = ring.c; cx.beginPath(); cx.arc(Math.cos(th) * r,Math.sin(th) * r * .94,d.r,0,6.2832); cx.fill();
          }
        }
        cx.restore();
      }
      let frame = 0;
      function tick(now) {
        frame = 0;
        if (!reducedMotion.matches) {
          const dt = previousFrame ? Math.min(.035,(now - previousFrame) / 1000) : 1 / 60;
          previousFrame = now;
          velocity = (velocity - 112 * ripple * dt) * Math.exp(-7.5 * dt);
          ripple = Math.max(-19,Math.min(19,ripple + velocity * dt));
          if (Math.abs(ripple) < .05 && Math.abs(velocity) < .15) ripple = velocity = 0;
        }
        draw(now);
        if (!reducedMotion.matches || leaving) frame = requestAnimationFrame(tick);
      }
      const schedule = () => { if (!frame) frame = requestAnimationFrame(tick); };

      exit.hidden = false;
      hint.hidden = false;

      function enterGlobe() {
        if (leaving) return;
        leaving = true;
        if (reducedMotion.matches) { location.assign(link.href); return; }
        openStart = performance.now();
        document.body.classList.add('intro-leaving');
        setTimeout(() => location.assign(link.href),950);
      }
      function onScroll() {
        const y = window.scrollY;
        const bottom = document.documentElement.scrollHeight - innerHeight;
        progress = clamp(y / Math.max(1,bottom));
        if (!reducedMotion.matches) {
          const impulse = Math.max(-180,Math.min(180,(y - lastY) * 1.1));
          velocity = Math.max(-230,Math.min(230,velocity - impulse));
        }
        if (y > lastY && bottom > 0 && y >= bottom - 3) enterGlobe();
        lastY = y;
        schedule();
      }
      window.addEventListener('scroll',onScroll,{passive:true});
      window.addEventListener('resize',() => { resize(); schedule(); });
      window.addEventListener('pageshow',event => {
        if (!event.persisted) return;
        leaving = false; openStart = 0; ripple = velocity = previousFrame = 0;
        document.body.classList.remove('intro-leaving');
        const bottom = document.documentElement.scrollHeight - innerHeight;
        if (window.scrollY >= bottom - 3) window.scrollTo({top:Math.max(0,bottom - exit.offsetHeight),behavior:'instant'});
        lastY = window.scrollY;
        schedule();
      });
      link.addEventListener('click',event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        enterGlobe();
      });
      resize();
      onScroll();
      schedule();
    })();
  </script>
</body>
</html>
