{const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'font');Object.defineProperty(CanvasRenderingContext2D.prototype,'font',{configurable:true,get(){return d.get.call(this)},set(v){d.set.call(this,v);const m=/(\d+(?:\.\d+)?)px/.exec(d.get.call(this));if('letterSpacing' in this&&m)this.letterSpacing=(-.05*m[1])+'px'}})}

const $=id=>document.getElementById(id);
const AGES=['10대','20대','30대','40대','50대','60대','70대+'];

const JOBC=[[225,232,245],[255,226,138],[182,156,255],[143,208,255],[255,159,208],[255,181,133],[159,240,192],[127,230,224],[255,143,160],[217,240,138]];

const josa=(w,a,b)=>{const c=String(w).slice(-1).charCodeAt(0);return(c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28))?a:b};
const ageGroup=a=>a<20?0:a<30?1:a<40?2:a<50?3:a<60?4:a<70?5:6;
const D=window.PEOPLE.map(([age,sex,job,wdw,hdw,wds,hds],i)=>({i,age,sex,job,ag:ageGroup(age),wdw,hdw,wds,hds,j:hdw-wdw}));
const N=D.length;
const avg=(a,f)=>a.reduce((s,d)=>s+f(d),0)/(a.length||1);

/* ---------- 벡터 ---------- */
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const ll2v=(lat,lon)=>[Math.cos(lat*RAD)*Math.sin(lon*RAD),Math.sin(lat*RAD),Math.cos(lat*RAD)*Math.cos(lon*RAD)];
function basis(c){let E=cross([0,1,0],c);if(Math.hypot(...E)<1e-6)E=[1,0,0];E=norm(E);return{E,N:cross(c,E)}}
function offsetPoint(c,x,y,B){const d=Math.hypot(x,y)*RAD,th=Math.atan2(x,y),s=Math.sin(d),k=Math.cos(d),ct=Math.cos(th),st=Math.sin(th);
  return[c[0]*k+(B.N[0]*ct+B.E[0]*st)*s,c[1]*k+(B.N[1]*ct+B.E[1]*st)*s,c[2]*k+(B.N[2]*ct+B.E[2]*st)*s]}

/* ---------- 24시간 닫힌 곡선 : 군집마다 모양이 다름. θ = 시각 (0시가 위, 시계방향) ---------- */
const TAU=Math.PI*2;
const TM=[[0,0],[180,.08],[720,.78],[1440,1]];
const tmap=m=>{m=Math.max(0,Math.min(1440,m));for(let i=1;i<TM.length;i++)if(m<=TM[i][0]){const a=TM[i-1],b=TM[i];return(a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0]))*TAU}return TAU};
const CURVES=[
  t=>[Math.sin(t),Math.cos(t)],
  t=>{const k=1/(1+Math.cos(t)**2);return[1.15*Math.sin(t)*k,1.5*Math.sin(t)*Math.cos(t)*k]},
  t=>{const r=.55+.45*Math.cos(5*t);return[r*Math.sin(t),r*Math.cos(t)]},
  t=>[(Math.sin(t)+2*Math.sin(2*t))/3,(Math.cos(t)-2*Math.cos(2*t))/-3],
  t=>{const r=.5+Math.cos(t);return[.65*r*Math.sin(t),.65*r*Math.cos(t)]},
  t=>{const r=1+.22*Math.cos(4*t);return[r*Math.sin(t),r*Math.cos(t)]},
  t=>[Math.sin(2*t+.4),Math.sin(3*t)]

/* ---------- 군집(연령대) 배치 + 사람 위치 ---------- */
const groups=[];for(let a=0;a<7;a++){const l=D.filter(d=>d.ag===a);if(l.length)groups.push({age:a,list:l.sort((x,y)=>x.wdw-y.wdw)})}
function placeClusters(k){
  const conts=groups.map(g=>({...g,Rc:k*Math.sqrt(g.list.length)}));conts.forEach(c=>c.R=c.Rc*1.2);
  const n=conts.length;conts.forEach((c,i)=>{c.tLon=n===1?0:-150+300*i/(n-1);c.c=ll2v((i%2?1:-1)*(n===1?0:16+(i%3)*10),c.tLon)});
  for(let it=0;it<600;it++){
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=conts[i],b=conts[j],ang=Math.acos(Math.max(-1,Math.min(1,dot(a.c,b.c)))),need=(a.R+b.R+4)*RAD;
      if(ang<need){const f=(need-ang)*.25,da=norm(b.c.map((v,q)=>v-a.c[q]*dot(a.c,b.c))),db=norm(a.c.map((v,q)=>v-b.c[q]*dot(a.c,b.c)));a.c=norm(a.c.map((v,q)=>v-da[q]*f));b.c=norm(b.c.map((v,q)=>v-db[q]*f))}}
    for(const c of conts){const lim=Math.sin(64*RAD);if(Math.abs(c.c[1])>lim){c.c[1]=Math.sign(c.c[1])*lim;c.c=norm(c.c)}
      const lat=Math.asin(c.c[1])/RAD;let lon=Math.atan2(c.c[0],c.c[2])/RAD,dl=c.tLon-lon;dl=((dl+540)%360)-180;lon+=dl*.12;c.c=ll2v(lat,lon)}
  }
  return conts;
}
let K=3.4,conts;for(let i=0;i<24;i++){conts=placeClusters(K);if(conts.reduce((s,c)=>s+Math.PI*c.R*c.R,0)<.8*41253)break;K*=.95}
const rn=(()=>{let a=12345;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
// 정점 버퍼: [0,N) 평일 노드, [N,2N) 휴일 점, [2N,3N) 경로 중간
const VT=new Float32Array(N*9),vtCount=[];const ribbons=[];let skel=[],tickLabels=[],edgesNet=[],edgesPath=[],hubs=[];
const vertex=(x,y,z)=>{vtCount.push(x,y,z);return vtCount.length/3-1};
const pos=(i,v)=>{VT[i*3]=v[0];VT[i*3+1]=v[1];VT[i*3+2]=v[2]};
const EXTRA=[];            // 골격·눈금 정점
function addExtra(v){EXTRA.push(v[0],v[1],v[2]);return 3*N+EXTRA.length/3-1}
const skelE=[];            // [a,b,age]
for(const c of conts){
  const B=basis(c.c),f=CURVES[c.age],R=c.Rc,shell=SHELL[c.age],wdv=.26*R;
  const at=(t,off)=>{const p=f(t),q=f(t+.002),r=f(t-.002),tx=q[0]-r[0],ty=q[1]-r[1],tl=Math.hypot(tx,ty)||1,nx=-ty/tl,ny=tx/tl;return[p[0]*R+nx*off,p[1]*R+ny*off]};

  // 사람
  const idx=[],grp=new Map();
  for(const d of c.list){
    const tj=(rn()-.5)*.05,tw=tmap(d.wdw)+tj,th=tmap(d.hdw)+tj,jit=(rn()-.5)*.1*R,ow=(d.wds-450)/450*wdv+jit,oh=(d.hds-450)/450*wdv+jit;
    const pw=at(tw,ow),ph=at(th,oh),rw=shell+(d.wds-450)/6000,rh=shell+(d.hds-450)/6000;
    pos(d.i,vec(pw,rw));pos(N+d.i,vec(ph,rh));
    d.pw=pw;

function nearest(x,y,rad){let b=-1,bd=rad*rad;for(let i=0;i<N;i++){if(SD[i]<.08)continue;const dx=SX[i]-x,dy=SY[i]-y,d=dx*dx+dy*dy;if(d<bd&&member(D[i])){bd=d;b=i}}return b}
addEventListener('keydown',e=>{if(e.key==='Escape'){S.you=null;S.age=null;S.job=null;applyState()}});
$('reset').onclick=()=>{const v=norm([160,70,230]);cam.position.set(v[0]*DIST,v[1]*DIST,v[2]*DIST);ctl.target.set(0,0,0);ctl.autoRotate=true};
$('zi').onclick=()=>{cam.position.multiplyScalar(.85)};$('zo').onclick=()=>{cam.position.multiplyScalar(1.18)};
/* ---------- 루프 ---------- */
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  try{
    const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
    if(Math.abs(DVT-DV)>.002){DV+=(DVT-DV)*Math.min(1,dt*7);layoutView()}else if(DV!==DVT){DV=DVT;layoutView()}
    ctl.update();U.uDist.value=cam.position.length();
    hMesh.visible=$('t_wk').checked;renderer.render(scene,cam);overlay(now);drawMini();
    if(grow>.98)$('hint').style.opacity=active()?0:1;
  }catch(err){console.error(err)}
}
resize();applyState();requestAnimationFrame(frame);
